apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: n8n-secrets
  namespace: n8n
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "8a590e7b-c177-4eb6-8994-9fdb47706acf"
    keyvaultName: "kv-n8n-asrghhasdf"
    tenantID: "febed21b-e5e1-4051-af72-142eca3e3f73"
    objects: |
      array:
        - |
          objectName: db-user
          objectType: secret
        - |
          objectName: db-pass
          objectType: secret
  secretObjects:
    - secretName: n8n-db-secrets
      type: Opaque
      data:
        - objectName: db-user
          key: DB_POSTGERSDB_USER
        - objectName: db-pass
          key: DB_POSTGRESDB_PASSWORD
